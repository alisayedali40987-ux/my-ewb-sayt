<!doctype html>
<html lang="en" dir="ltr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#f4f2e9">
	<meta name="description" content="TDMHARK social links.">
	<title>TDMHARK | Hark</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<style>
		:root {
			color-scheme: light;
			--paper: #f4f2e9;
			--ink: #202b26;
			--muted: #68736c;
			--green: #356a4b;
			--green-dark: #244a35;
			--lime: #d5ed78;
			--line: #d8dbcf;
			--coral: #ed755b;
		}

		* { box-sizing: border-box; }

		body {
			min-width: 320px;
			min-height: 100vh;
			margin: 0;
			color: var(--ink);
			background: var(--paper) radial-gradient(#b4bca8 0.7px, transparent 0.7px) 0 0 / 18px 18px;
			font-family: "Manrope", "Segoe UI", sans-serif;
		}

		.scene {
			position: fixed;
			inset: 0;
			z-index: 0;
			overflow: hidden;
			background: #111714;
		}
		.scene video { width: 100%; height: 100%; object-fit: cover; }
		body:not(.entered) { overflow: hidden; }

		.entry-screen {
			position: fixed;
			inset: 0;
			z-index: 5;
			display: grid;
			place-items: center;
			overflow: hidden;
			background: #05070b;
			color: #fff;
			transition: opacity 550ms ease, visibility 550ms ease;
		}
		.entry-screen[hidden] { display: none; }
		.entry-screen::after {
			position: absolute;
			inset: 0;
			background: linear-gradient(180deg, rgba(4, 6, 10, 0.02), rgba(4, 6, 10, 0.08) 48%, rgba(4, 6, 10, 0.58));
			content: "";
		}
		.entry-screen.is-leaving { visibility: hidden; opacity: 0; }
		.entry-image { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center top; }
		.entry-content { position: relative; z-index: 1; display: grid; justify-items: center; gap: 22px; padding: 24px; }
		.entry-brand { margin: 0; color: #fff; font-size: 24px; font-weight: 800; text-shadow: 0 2px 18px #000; }
		.enter-button {
			min-width: 156px;
			min-height: 54px;
			padding: 10px 24px;
			border: 1px solid rgba(255, 255, 255, 0.82);
			border-radius: 6px;
			background: rgba(5, 8, 12, 0.48);
			color: #fff;
			font: inherit;
			font-size: 16px;
			font-weight: 800;
			letter-spacing: 0.12em;
			cursor: pointer;
			backdrop-filter: blur(8px);
			transition: background-color 180ms ease, transform 180ms ease;
		}
		.enter-button:hover { background: rgba(5, 8, 12, 0.76); transform: translateY(-2px); }
		.enter-button:focus-visible { outline: 3px solid var(--coral); outline-offset: 4px; }

		.shell {
			position: relative;
			z-index: 1;
			width: min(100% - 36px, 1040px);
			min-height: 100vh;
			margin-inline: auto;
			display: grid;
			grid-template-rows: auto 1fr auto;
			opacity: 0;
			visibility: hidden;
			pointer-events: none;
			transition: opacity 500ms ease, visibility 500ms ease;
		}
		body.entered .shell { opacity: 1; visibility: visible; pointer-events: auto; }

		header, footer { display: flex; align-items: center; justify-content: space-between; }
		header { min-height: 74px; border-bottom: 1px solid var(--line); }
		.brand { display: inline-flex; align-items: center; gap: 10px; color: var(--green-dark); font-weight: 800; }
		.brand-mark { display: grid; width: 32px; aspect-ratio: 1; place-items: center; border-radius: 50%; background: var(--lime); }
		.top-note, footer { color: var(--muted); font-size: 12px; font-weight: 600; }

		main {
			display: grid;
			grid-template-columns: minmax(0, 0.85fr) minmax(0, 1fr);
			align-items: center;
			gap: clamp(28px, 6vw, 72px);
			width: min(100%, 790px);
			margin: auto;
			padding: 58px 0;
			animation: arrive 600ms ease-out both;
		}

		.intro { max-width: 390px; }
		.eyebrow { display: flex; align-items: center; gap: 8px; color: var(--green); font-size: 22px; font-weight: 800; }
		.eyebrow::before { width: 8px; height: 8px; border-radius: 50%; background: var(--coral); content: ""; }
		h1 { margin: 0; font-size: clamp(40px, 5vw, 58px); font-weight: 800; line-height: 1.2; }
		h1 span { display: block; color: var(--green); }
		.bio { color: var(--muted); font-size: 15px; line-height: 1.9; }

		.avatar {
			position: relative;
			display: grid;
			width: 148px;
			aspect-ratio: 1;
			margin-bottom: 23px;
			place-items: center;
			border: 1px solid var(--green-dark);
			border-radius: 50%;
			background: var(--lime);
			color: var(--green-dark);
			font-size: 62px;
			font-weight: 800;
			box-shadow: 8px 8px 0 var(--green-dark);
			transform: rotate(-5deg);
			overflow: hidden;
		}
		.avatar-photo { position: absolute; top: -4%; left: -50%; z-index: 1; display: block; width: 200%; height: 200%; max-width: none; object-fit: cover; }
		.avatar-photo[hidden] { display: none; }

		.avatar::after {
			position: absolute;
			top: 8px;
			left: 0;
			width: 23px;
			aspect-ratio: 1;
			border: 1px solid var(--green-dark);
			border-radius: 50%;
			z-index: 2;
			background: var(--coral);
			content: "";
		}

		h2 { margin: 0; font-size: 23px; font-weight: 800; }
		.handle { margin: 2px 0 0; color: var(--muted); font-size: 13px; text-align: left; }
		nav { display: grid; gap: 10px; margin-top: 22px; }

		.link {
			display: flex;
			min-height: 63px;
			align-items: center;
			gap: 13px;
			padding: 9px 13px;
			border: 1px solid var(--line);
			border-radius: 9px;
			background: rgba(255, 255, 255, 0.65);
			text-decoration: none;
			transition: background-color 160ms ease, border-color 160ms ease, transform 160ms ease;
		}

		.link:hover, .link:focus-visible { border-color: var(--green); background: #fffef8; transform: translateY(-2px); }
		.link:focus-visible { outline: 3px solid var(--coral); outline-offset: 3px; }
		.icon { display: grid; width: 39px; aspect-ratio: 1; flex: 0 0 auto; place-items: center; border-radius: 8px; background: var(--green-dark); color: white; direction: ltr; font-size: 12px; font-weight: 800; }
		.icon img { display: block; width: 19px; height: 19px; }
		.copy { display: grid; gap: 1px; }
		.title { font-size: 14px; font-weight: 800; }
		.description { color: var(--muted); font-size: 11px; }
		.arrow { margin-inline-start: auto; color: var(--green); font-size: 20px; transition: transform 160ms ease; }
		.link:hover .arrow { transform: translateX(3px); }
		footer { min-height: 60px; border-top: 1px solid var(--line); }
		footer span:last-child { direction: ltr; }

		@keyframes arrive { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

		@media (max-width: 760px) {
			.shell { width: min(100% - 36px, 520px); }
			header { min-height: 66px; }
			main { grid-template-columns: 1fr; justify-items: center; gap: 32px; padding: 42px 0; }
			.intro { text-align: center; }
			.eyebrow { justify-content: center; }
			h1 { font-size: 42px; }
			.bio { margin-inline: auto; }
			.profile { width: min(100%, 400px); }
			.avatar { width: 136px; margin-inline: auto; font-size: 55px; }
			.handle { text-align: center; }
			nav { width: 100%; margin-top: 19px; }
			footer { min-height: 54px; font-size: 11px; }
		}

		@media (max-width: 420px) {
			.shell { width: min(100% - 28px, 400px); }
			header { min-height: 60px; gap: 8px; }
			.brand { gap: 8px; font-size: 13px; }
			.brand-mark { width: 28px; }
			.sound-toggle { min-height: 34px; padding: 6px 8px; font-size: 10px; }
			.eyebrow { font-size: 20px; }
			.avatar { width: 122px; font-size: 49px; }
			.link { min-height: 58px; gap: 10px; padding: 8px 10px; }
			.icon { width: 36px; }
			footer { gap: 8px; font-size: 10px; }
			.entry-brand { font-size: 21px; }
			.enter-button { min-width: 140px; min-height: 50px; }
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
		}

		:root {
			color-scheme: dark;
			--paper: #111714;
			--ink: #f2f0e6;
			--muted: #a8b1a8;
			--green: #a2d4ad;
			--green-dark: #d9e7d8;
			--lime: #d8b66b;
			--line: #34413a;
			--coral: #ee8066;
		}

		body {
			background-color: var(--paper);
			background-image: linear-gradient(rgba(162, 212, 173, 0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(162, 212, 173, 0.035) 1px, transparent 1px), radial-gradient(#36433a 0.7px, transparent 0.7px);
			background-size: 56px 56px, 56px 56px, 18px 18px;
		}

		header { border-color: var(--line); }
		.brand-mark { border-radius: 8px; color: #171a15; box-shadow: 0 0 24px rgba(216, 182, 107, 0.22); }
		.top-note { letter-spacing: 0.08em; }
		.eyebrow { color: var(--lime); }
		h1 { letter-spacing: 0; }
		h1 span { color: var(--lime); }
		.bio { max-width: 330px; }
		.profile { width: 100%; }
		.avatar {
			border-color: rgba(216, 182, 107, 0.65);
			background: linear-gradient(145deg, #28352d, #19211c);
			color: var(--lime);
			box-shadow: 8px 8px 0 #29352d, 0 0 42px rgba(162, 212, 173, 0.11);
		}
		.avatar::after { border-color: var(--paper); }
		h2 { color: var(--ink); }
		.link {
			border-color: var(--line);
			background: rgba(29, 38, 33, 0.84);
			backdrop-filter: blur(8px);
		}
		.link:hover, .link:focus-visible { border-color: var(--lime); background: #232d26; }
		.icon { background: #35453a; color: var(--lime); }
		.link:nth-child(2) .icon { background: #263b44; color: #82d7ef; }
		.link:nth-child(3) .icon { background: #432b2b; color: #ff9691; }
		.link:nth-child(4) .icon { background: #33304c; color: #c8c1ff; }
		.arrow { color: var(--lime); }
		footer { border-color: var(--line); }

		.sound-toggle {
			min-height: 38px;
			padding: 7px 11px;
			border: 1px solid rgba(216, 182, 107, 0.55);
			border-radius: 7px;
			background: rgba(216, 182, 107, 0.1);
			color: var(--lime);
			font: inherit;
			font-size: 11px;
			font-weight: 700;
			white-space: nowrap;
			cursor: pointer;
			transition: background-color 160ms ease, border-color 160ms ease;
		}
		.sound-toggle:hover { border-color: var(--lime); background: rgba(216, 182, 107, 0.2); }
		.sound-toggle:focus-visible { outline: 2px solid var(--coral); outline-offset: 3px; }
	</style>
</head>
<body>
	<div class="scene" aria-hidden="true">
		<video id="background-video" autoplay muted loop playsinline preload="auto">
			<source src="./videoplayback.mp4" type="video/mp4">
		</video>
	</div>
	<section class="entry-screen" id="entry-screen" role="dialog" aria-modal="true" aria-label="Enter TDMHARK">
		<img class="entry-image" src="./7523246906824279061_avatar.png.jpg" alt="">
		<div class="entry-content">
			<p class="entry-brand">TDMHARK</p>
			<button class="enter-button" id="enter-button" type="button">ENTER</button>
		</div>
	</section>
	<div class="shell" id="main-site" inert aria-hidden="true">
		<header>
			<div class="brand"><span class="brand-mark" aria-hidden="true">T</span><span>TDMHARK</span></div>
			<button class="sound-toggle" id="sound-toggle" type="button" aria-pressed="false">Play background sound</button>
		</header>

		<main>
			<section class="intro">
				<p class="eyebrow">Welcome</p>
			</section>

			<section class="profile" aria-label="Social links">
				<div class="avatar" aria-label="Hark profile picture">
					<span aria-hidden="true">H</span>
					<img class="avatar-photo" id="avatar-photo" src="./7523246906824279061_avatar.png.jpg" alt="Hark profile picture" hidden>
				</div>
				<h2>Hark</h2>
				<p class="handle">@TDMHARK</p>
				<nav aria-label="Social media links">
					<a class="link" href="http://tiktok.com/@harkalking1" target="_blank" rel="noopener noreferrer">
						<span class="icon" aria-hidden="true"><img src="https://cdn.simpleicons.org/tiktok/FFFFFF" alt=""></span>
						<span class="copy"><span class="title">TikTok</span><span class="description">Follow me on TikTok</span></span>
						<span class="arrow" aria-hidden="true">→</span>
					</a>
					<a class="link" href="https://t.me/FILESHARK1" target="_blank" rel="noopener noreferrer">
						<span class="icon" aria-hidden="true"><img src="https://cdn.simpleicons.org/telegram/FFFFFF" alt=""></span>
						<span class="copy"><span class="title">Telegram</span><span class="description">Join me on Telegram</span></span>
						<span class="arrow" aria-hidden="true">→</span>
					</a>
					<a class="link" href="https://youtube.com/@hark1234-z8d?si=9qr87mi-wSPFdYiC" target="_blank" rel="noopener noreferrer">
						<span class="icon" aria-hidden="true"><img src="https://cdn.simpleicons.org/youtube/FFFFFF" alt=""></span>
						<span class="copy"><span class="title">YouTube</span><span class="description">Subscribe to my channel</span></span>
						<span class="arrow" aria-hidden="true">→</span>
					</a>
					<a class="link" href="https://discord.gg/NHySvnCG4" target="_blank" rel="noopener noreferrer">
						<span class="icon" aria-hidden="true"><img src="https://cdn.simpleicons.org/discord/FFFFFF" alt=""></span>
						<span class="copy"><span class="title">Discord</span><span class="description">Join my server</span></span>
						<span class="arrow" aria-hidden="true">→</span>
					</a>
				</nav>
			</section>
		</main>

		<footer><span>All my links, in one place.</span><span>© 2026</span></footer>
	</div>
	<script>
		const backgroundVideo = document.getElementById("background-video");
		const soundToggle = document.getElementById("sound-toggle");
		const entryScreen = document.getElementById("entry-screen");
		const enterButton = document.getElementById("enter-button");
		const mainSite = document.getElementById("main-site");
		const avatarPhoto = document.getElementById("avatar-photo");
		const showAvatarPhoto = () => { avatarPhoto.hidden = avatarPhoto.naturalWidth === 0; };
		avatarPhoto.addEventListener("load", showAvatarPhoto);
		avatarPhoto.addEventListener("error", () => { avatarPhoto.hidden = true; });
		if (avatarPhoto.complete) showAvatarPhoto();

		const updateSoundToggle = () => {
			const soundIsOn = !backgroundVideo.muted;
			soundToggle.setAttribute("aria-pressed", String(soundIsOn));
			soundToggle.textContent = soundIsOn ? "Mute video" : "Play background sound";
		};

		async function startBackgroundVideo() {
			backgroundVideo.muted = false;
			try {
				await backgroundVideo.play();
			} catch {
				backgroundVideo.muted = true;
				await backgroundVideo.play().catch(() => {});
			}
			updateSoundToggle();
		}

		enterButton.addEventListener("click", () => {
			mainSite.inert = false;
			mainSite.removeAttribute("aria-hidden");
			document.body.classList.add("entered");
			entryScreen.classList.add("is-leaving");
			startBackgroundVideo();
			window.setTimeout(() => { entryScreen.hidden = true; }, 600);
		});

		soundToggle.addEventListener("click", async () => {
			backgroundVideo.muted = !backgroundVideo.muted;
			if (!backgroundVideo.muted) {
				try {
					await backgroundVideo.play();
				} catch {
					backgroundVideo.muted = true;
				}
			}

			updateSoundToggle();
		});
	</script>
</body>
</html>
